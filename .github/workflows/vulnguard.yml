name: 🛡️ VulnGuard AI Security Scan

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install --upgrade PyGithub google-generativeai

      - name: Run VulnGuard AI Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat << 'EOF' > ai_scanner.py
          import os
          import time
          import google.generativeai as genai
          from github import Github

          # Config
          genai.configure(api_key=os.getenv("GEMINI_API_KEY"))

          # -------------------------------------------------------
          # 🎯 MODEL SELECTOR (ฉบับอิงตาม Log ของคุณ)
          # -------------------------------------------------------
          # เลือกเฉพาะตัวที่มีใน Log ของคุณเท่านั้น เพื่อกัน 404
          candidate_models = [
              'gemini-flash-latest',       # ✅ ตัวนี้มีใน Log ชัวร์ (น่าจะเป็น 1.5)
              'gemini-pro-latest',         # ✅ ตัวนี้ก็มีใน Log (สำรอง)
              'gemini-2.0-flash-lite-preview-02-05', # เผื่อฟลุ๊คตัว Lite ฟรี
          ]

          def get_working_model():
              print("🔍 Finding a working model from your available list...")
              
              for model_name in candidate_models:
                  print(f"👉 Testing model: {model_name} ...", end=" ")
                  try:
                      model = genai.GenerativeModel(model_name)
                      # ลองยิงคำถามสั้นๆ เพื่อเช็ค Quota
                      response = model.generate_content("Hi")
                      if response and response.text:
                          print("✅ WORKED! (Quota Available)")
                          return model
                  except Exception as e:
                      print(f"❌ Failed ({e})")
                      time.sleep(1) 
              
              # ถ้าไม่เจอเลย ให้ลองตัวสุดท้ายแบบวัดดวง (gemini-pro)
              print("⚠️ All specific models failed, trying generic 'gemini-pro'...")
              return genai.GenerativeModel('gemini-pro')

          def analyze():
              print("🚀 Starting Analysis...")
              
              # 1. หาโมเดล
              try:
                  model = get_working_model()
              except:
                  print("❌ Could not find any working model.")
                  return

              g = Github(os.getenv("GITHUB_TOKEN"))
              repo = g.get_repo(os.getenv("REPO_NAME"))
              pr = repo.get_pull(int(os.getenv("PR_NUMBER")))
              
              # 2. Get Diff
              diff_text = ""
              for file in pr.get_files():
                  diff_text += f"\n--- File: {file.filename} ---\n"
                  diff_text += file.patch[:5000] if file.patch else "New File"

              if not diff_text or len(diff_text) < 10:
                  print("❌ No code changes found.")
                  pr.create_issue_comment("⚠️ VulnGuard: ไม่พบการแก้ไข Code (No Diff found)")
                  return

              # 3. Ask AI
              prompt = f"""
              Role: You are 'VulnGuard'.
              Task: Analyze this code diff.
              Code:
              {diff_text[:15000]}
              
              If Vulnerable: Show "🚨 Security Alert" and "☠️ Hack Simulator".
              If Safe: Show "✅ Code looks secure".
              """
              
              print("🧠 Sending to Gemini...")
              try:
                  response = model.generate_content(prompt)
                  ai_text = response.text
                  print("✅ AI Responded!")
                  print("📝 Posting to GitHub...")
                  pr.create_issue_comment(ai_text)
                  print("✅ Comment Posted!")
                  
              except Exception as e:
                  print(f"❌ AI/Post Error: {e}")
                  pr.create_issue_comment(f"⚠️ VulnGuard Error: {e}")

          if __name__ == "__main__":
              try:
                  analyze()
              except Exception as e:
                  print(f"🔥 Critical Error: {e}")
          EOF

          python ai_scanner.py
