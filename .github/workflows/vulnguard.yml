name: 🛡️ VulnGuard AI Security Scan

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # ✅ อัปเกรดเป็น 3.10 ลบ Warning

      - name: Install Dependencies
        # ✅ อัปเกรด Library ให้ใหม่ล่าสุด
        run: pip install --upgrade PyGithub google-generativeai

      - name: Run VulnGuard AI Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat << 'EOF' > ai_scanner.py
          import os
          import google.generativeai as genai
          from github import Github

          # Config
          genai.configure(api_key=os.getenv("GEMINI_API_KEY"))

          # ✅ ระบบเลือกโมเดลอัตโนมัติ (กันตาย)
          try:
              # ลองใช้ Flash รุ่นล่าสุดก่อน
              model = genai.GenerativeModel('gemini-1.5-flash-latest')
          except:
              print("⚠️ Flash model not found, switching to Gemini Pro")
              model = genai.GenerativeModel('gemini-pro')

          def analyze():
              print("🚀 Starting Analysis...")
              g = Github(os.getenv("GITHUB_TOKEN"))
              repo = g.get_repo(os.getenv("REPO_NAME"))
              pr = repo.get_pull(int(os.getenv("PR_NUMBER")))
              
              # 1. Get Diff
              diff_text = ""
              for file in pr.get_files():
                  # เอา filter นามสกุลออกเพื่อ Test ให้ชัวร์ว่าเจอไฟล์
                  diff_text += f"\n--- File: {file.filename} ---\n"
                  diff_text += file.patch[:5000] if file.patch else "New File"

              if not diff_text or len(diff_text) < 10:
                  print("❌ No code changes found.")
                  pr.create_issue_comment("⚠️ VulnGuard: ไม่พบการแก้ไข Code (No Diff found)")
                  return

              # 2. Ask AI
              prompt = f"""
              Role: You are 'VulnGuard'.
              Task: Analyze this code diff.
              Code:
              {diff_text[:15000]}
              
              If Vulnerable: Show "🚨 Security Alert" and "☠️ Hack Simulator".
              If Safe: Show "✅ Code looks secure".
              """
              
              print("🧠 Sending to Gemini...")
              try:
                  response = model.generate_content(prompt)
                  ai_text = response.text
                  print("✅ AI Responded!")
                  
                  # 3. Post Comment
                  print("📝 Posting to GitHub...")
                  pr.create_issue_comment(ai_text)
                  print("✅ Comment Posted!")
                  
              except Exception as e:
                  print(f"❌ AI/Post Error: {e}")
                  # พยายามใช้ Gemini Pro อีกครั้งถ้า Flash Error ตอน Generate
                  try:
                      print("🔄 Retrying with Gemini Pro...")
                      fallback_model = genai.GenerativeModel('gemini-pro')
                      response = fallback_model.generate_content(prompt)
                      pr.create_issue_comment(response.text)
                  except Exception as e2:
                      pr.create_issue_comment(f"⚠️ VulnGuard Error: {e} | Retry Error: {e2}")

          if __name__ == "__main__":
              try:
                  analyze()
              except Exception as e:
                  print(f"🔥 Critical Error: {e}")
          EOF

          python ai_scanner.py
