name: 🛡️ VulnGuard AI Security Scan

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # ใช้รุ่นใหม่ ลดปัญหา Library เก่า

      - name: Install Dependencies
        run: pip install --upgrade PyGithub google-generativeai

      - name: Run VulnGuard AI Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat << 'EOF' > ai_scanner.py
          import os
          import time
          import google.generativeai as genai
          from github import Github

          # Config
          genai.configure(api_key=os.getenv("GEMINI_API_KEY"))

          def get_best_model():
              print("🔍 Scanning for available models...")
              try:
                  # 1. ดึง List โมเดลทั้งหมดที่ Key คุณใช้ได้
                  available_models = []
                  for m in genai.list_models():
                      if 'generateContent' in m.supported_generation_methods:
                          available_models.append(m.name)
                  
                  print(f"📋 Found models: {available_models}")

                  # 2. จัดลำดับความสำคัญ (Priority List)
                  # เลือก gemini-1.5 หรือ flash-latest ก่อน (เพราะฟรีและเสถียร)
                  # เลี่ยง 2.0 (เพราะคุณติด Quota)
                  priority_keywords = [
                      'gemini-1.5-flash', 
                      'gemini-flash-latest', 
                      'gemini-1.5-pro',
                      'gemini-pro',
                  ]
                  
                  # 3. ลอง Test ยิงทีละตัว (Auto-Discovery)
                  for keyword in priority_keywords:
                      # หาโมเดลที่มีชื่อตรงกับ keyword
                      candidates = [m for m in available_models if keyword in m]
                      
                      for model_name in candidates:
                          # ข้ามตัว 2.0 ไปก่อน เพราะ Log ฟ้องว่า Quota เต็ม
                          if '2.0' in model_name: 
                              continue
                              
                          print(f"👉 Testing model: {model_name} ...", end=" ")
                          try:
                              test_model = genai.GenerativeModel(model_name)
                              test_model.generate_content("Ping") # Test ยิงจริง
                              print("✅ SUCCESS! Using this model.")
                              return test_model
                          except Exception as e:
                              print(f"❌ Failed ({e})")
                              time.sleep(1)

                  # ถ้าไม่เจอเลย ให้ลองตัวสุดท้ายที่มี (Fallback)
                  print("⚠️ No priority model worked. Trying first available...")
                  return genai.GenerativeModel(available_models[0])

              except Exception as e:
                  print(f"🔥 Error listing models: {e}")
                  # ไม้ตายสุดท้าย: ใช้ชื่อ Alias ที่มีใน Log ชัวร์ๆ
                  return genai.GenerativeModel('gemini-flash-latest')

          def analyze():
              print("🚀 Starting Analysis...")
              
              # เลือกโมเดลอัตโนมัติ
              model = get_best_model()
              
              g = Github(os.getenv("GITHUB_TOKEN"))
              repo = g.get_repo(os.getenv("REPO_NAME"))
              pr = repo.get_pull(int(os.getenv("PR_NUMBER")))
              
              # 1. Get Diff
              diff_text = ""
              for file in pr.get_files():
                  diff_text += f"\n--- File: {file.filename} ---\n"
                  diff_text += file.patch[:5000] if file.patch else "New File"

              if not diff_text or len(diff_text) < 10:
                  print("❌ No code changes found.")
                  pr.create_issue_comment("⚠️ VulnGuard: ไม่พบการแก้ไข Code (No Diff found)")
                  return

              # 2. Ask AI
              prompt = f"""
              Role: You are 'VulnGuard'.
              Task: Analyze this code diff.
              Code:
              {diff_text[:15000]}
              
              If Vulnerable: Show "🚨 Security Alert" and "☠️ Hack Simulator".
              If Safe: Show "✅ Code looks secure".
              """
              
              print("🧠 Sending to Gemini...")
              try:
                  response = model.generate_content(prompt)
                  ai_text = response.text
                  print("✅ AI Responded!")
                  print("📝 Posting to GitHub...")
                  pr.create_issue_comment(ai_text)
                  print("✅ Comment Posted!")
                  
              except Exception as e:
                  print(f"❌ AI/Post Error: {e}")
                  pr.create_issue_comment(f"⚠️ VulnGuard Error: {e}")

          if __name__ == "__main__":
              try:
                  analyze()
              except Exception as e:
                  print(f"🔥 Critical Error: {e}")
          EOF

          python ai_scanner.py
